name: Build and release plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: get_version
        run: |
          ver=$(grep -Po '"version"\s*:\s*"\K[^"]+' plugins/ai-factory-av/plugin.json)
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Build plugin zip
        run: |
          chmod +x scripts/build_plugin.sh
          ./scripts/build_plugin.sh plugins/ai-factory-av

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: "AI Factory AV ${{ steps.get_version.outputs.version }}"
          body: "Automated plugin release"
          draft: false
          prerelease: false

      - name: Upload plugin zip
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/ai-factory-av-${{ steps.get_version.outputs.version }}.zip
          asset_name: ai-factory-av-${{ steps.get_version.outputs.version }}.zip
          asset_content_type: application/zip
