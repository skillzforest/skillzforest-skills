[package]
name = "skillzforest-installer"
version = "0.1.0"
description = "SkillzForest Installer — installs SkillzForest skills and packs into local AI runtimes"
authors = ["SkillzForest"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
thiserror = "1"
